# Alternativa a Vercel. Ya no hace falta disco persistente (los datos viven en
# PostgreSQL), así que el plan gratuito sirve. Ojo: en el plan gratuito Render
# duerme el servicio tras unos minutos sin tráfico y la primera visita tarda.
services:
  - type: web
    name: plaza-galilea
    runtime: node
    branch: main
    plan: free
    region: ohio

    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /

    envVars:
      - key: NODE_VERSION
        value: "24"

      # Las dos se piden al crear el blueprint; no quedan escritas en el repo.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
