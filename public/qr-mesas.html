<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>QR por mesa · Plaza Galilea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background: #ece6dc; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px; max-width: 900px; margin: 0 auto; }
    .sheet { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; max-width: 900px; margin: 0 auto 40px; padding: 0 20px; }
    .qr-table-card {
      background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
      padding: 26px 22px; text-align: center; break-inside: avoid; page-break-inside: avoid;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .qr-table-card .brand-badge { width: 58px; height: 58px; font-size: .72rem; }
    .qr-table-card .script { font-family: var(--font-script); font-size: 2rem; color: var(--terra); line-height: 1; }
    .qr-table-card img { width: 190px; height: 190px; }
    .qr-table-card .mesa { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
    .qr-table-card .ig { font-size: .8rem; color: var(--muted); }
    @media (max-width: 560px) { .sheet { grid-template-columns: 1fr; } }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .sheet { padding: 0; gap: 10mm; }
      .qr-table-card { border: 1px dashed #bbb; }
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <h1 style="font-size:1.8rem;margin:0">QR para las mesas</h1>
      <p class="muted" style="margin:0" id="info"></p>
    </div>
    <button class="btn btn-primary" onclick="window.print()">Imprimir</button>
  </div>
  <div class="sheet" id="sheet"></div>

  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const clamp = (v, d) => Math.min(200, Math.max(1, Number.parseInt(v, 10) || d));
      const from = clamp(params.get('desde'), 1);
      const to = Math.min(clamp(params.get('hasta'), from), from + 59);
      const cards = [];
      for (let n = from; n <= to; n++) {
        cards.push(`
          <div class="qr-table-card">
            <span class="brand-badge"><small>PLAZA</small>GALILEA</span>
            <span class="script">Escanea y mira nuestro menú</span>
            <img src="/qr/menu.svg?mesa=${n}" alt="QR del menú, mesa ${n}">
            <span class="mesa">Mesa ${n}</span>
            <span class="ig">@galilea.plaza_</span>
          </div>`);
      }
      document.getElementById('sheet').innerHTML = cards.join('');
      document.getElementById('info').textContent = `Mesas ${from} a ${to} · ${cards.length} tarjetas`;
    })();
  </script>
</body>
</html>
